<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Managed by chezmoi (~/dev/bootstrap) — D-14. Maple Mono NF is the terminal/editor font.
     Fallback chain for glyphs it lacks: Symbols Nerd Font Mono (icons, single-cell) and
     Noto Color Emoji. Ghostty does its own fallback, this covers every other fontconfig app.

     Ordering (review L-1): the numeric prefix only orders files WITHIN ~/.config/fontconfig/conf.d.
     All user files are pulled in as a block by /etc/fonts/conf.d/50-user.conf, i.e. after system
     snippets 00-49 and before 51-99 (e.g. 60-latin.conf, 65-nonlatin.conf), whatever their own
     number. Inside the user dir: 10-nerd-font-symbols.conf (upstream, chezmoi external) loads
     first, then this file. They don't conflict: upstream's file never mentions "Maple Mono NF".
     Upstream does add a weak <prefer>"Symbols Nerd Font"</prefer> (the proportional variant) to the
     generic "monospace" alias; because the binding is weak, language coverage still wins, so
     `fc-match monospace` stays Noto Sans Mono and Symbols Nerd Font is only its first fallback
     (verified in a scratch fontconfig, 2026-10-10). This file uses the single-cell Mono variant. -->
<fontconfig>
  <alias binding="same">
    <family>Maple Mono NF</family>
    <accept>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </accept>
  </alias>
</fontconfig>
