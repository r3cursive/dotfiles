; gruvbox-material — fast-syntax-highlighting theme for the Gruvbox Material "hard" dark palette.
; Values are truecolor hex (fast-theme accepts #rrggbb). Mapping follows sainnhe/gruvbox-material's
; vim groups where they don't collide: Function=green bold, Operator=orange, Identifier=blue,
; Comment=grey1; strings use yellow (not green) so they never look like commands.
; bg #1d2021 · fg #d4be98 · red #ea6962 · orange #e78a4e · yellow #d8a657 · green #a9b665
; aqua #89b482 · blue #7daea3 · purple #d3869b · grey1 #928374 · bg3 #3c3836

[base]
default          = none
unknown-token    = #ea6962,bold
commandseparator = #d3869b
redirection      = #d3869b
here-string-tri  = #d3869b
here-string-text = bg:#3c3836
here-string-var  = #7daea3,bg:#3c3836
exec-descriptor  = #d3869b,bold
comment          = #928374
correct-subtle   = bg:#3c3836
incorrect-subtle = #ea6962
subtle-separator = #a9b665
subtle-bg        = bg:#3c3836
secondary        = free

[command-point]
reserved-word  = #d3869b
subcommand     = #89b482
alias          = #a9b665,bold
suffix-alias   = #a9b665,bold
global-alias   = #a9b665,bg:#3c3836
builtin        = #a9b665,bold
function       = #a9b665,bold
command        = #a9b665,bold
precommand     = #a9b665,bold
hashed-command = #a9b665,bold
single-sq-bracket = #d3869b
double-sq-bracket = #d3869b
double-paren   = #d3869b

[paths]
path          = underline
pathseparator =
path-to-dir   = underline
globbing      = #7daea3,bold
globbing-ext  = #7daea3,bold

[brackets]
paired-bracket  = bg:#3c3836
bracket-level-1 = #e78a4e,bold
bracket-level-2 = #d3869b,bold
bracket-level-3 = #7daea3,bold

[arguments]
single-hyphen-option   = #e78a4e
double-hyphen-option   = #e78a4e
back-quoted-argument   = none
single-quoted-argument = #d8a657
double-quoted-argument = #d8a657
dollar-quoted-argument = #d8a657

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #e78a4e
; backslash or $... in "..."
back-or-dollar-double-quoted-argument = #7daea3

[other]
variable             = #7daea3
assign               = none
assign-array-bracket = #d3869b
history-expansion    = #7daea3,bold

[math]
mathvar = #7daea3
mathnum = #d3869b
matherr = #ea6962

[for-loop]
forvar  = #7daea3
fornum  = #d3869b
foroper = #e78a4e
forsep  = #d3869b

[case]
case-input       = #7daea3
case-parentheses = #d3869b
case-condition   = bg:#3c3836
